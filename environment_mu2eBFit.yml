# mu2eBFit: LSQ (lmfit) + PINN (TensorFlow 2.14) env for docdb-48750 and the FMS packages.
# scipy is pinned to 1.15.2 (python >= 3.10 required). scipy >= 1.15 runs scipy.optimize.leastsq (lmfit method 'leastsq', LM) on a C
# translation of MINPACK; scipy <= 1.14 used the Fortran original. On the paper's Fourier-Bessel bases (condition number ~1e10) the two
# stop at different LM points (~1e-5 in chi2, up to ~3e-3 in the smallest residual SDs), so the paper's LM fits reproduce bit for bit only
# with scipy >= 1.15 (checked 2026-10-27: scipy 1.15.2 reproduces the stored fits of models 1, 8 and 1_toy_0 exactly; 1.12.0 and 1.14.1 do not).
# The SVD solve (method 'linear_fast') is identical in both. Install the two packages afterwards with pip install -e (not listed here).
name: mu2eBFit
channels:
  - conda-forge
